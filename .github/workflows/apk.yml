name: Build Krypton Wrapper plugin APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Repo ini tidak membawa glslang & SPIRV-Cross, jadi diambil saat build.
      # Untuk versi tetap, tambahkan "--branch <tag>" pada git clone.
      - name: Ambil glslang dan SPIRV-Cross
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/glslang.git 3rdparty/glslang
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Cross.git 3rdparty/SPIRV-Cross

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Install NDK, CMake, SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;27.3.13750724" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks"
              echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_BASE64 belum diisi; APK ditandatangani dengan kunci sementara. Tiap build kuncinya beda, jadi update APK di atas versi lama akan ditolak Android (uninstall dulu)."
            keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -alias ci -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass android -keypass android -dname "CN=Krypton CI"
            {
              echo "SIGNING_STORE_FILE=$RUNNER_TEMP/ci.jks"
              echo "SIGNING_STORE_PASSWORD=android"
              echo "SIGNING_KEY_ALIAS=ci"
              echo "SIGNING_KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
          fi

      - name: Build plugin APK
        run: gradle --no-daemon -p android-plugin :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KryptonWrapper-plugin
          path: android-plugin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
